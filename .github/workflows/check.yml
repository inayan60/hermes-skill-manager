name: Plugin smoke tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python backend
        run: |
          python -m pip install fastapi httpx pytest
          python -m pytest -q tests/test_backend.py
      - name: Check Desktop JavaScript syntax
        run: |
          cp desktop/plugin.js /tmp/hermes-skill-manager-plugin.mjs
          node --check /tmp/hermes-skill-manager-plugin.mjs