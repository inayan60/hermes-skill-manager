name: Plugin smoke tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Python backend and isolation
        run: |
          python -m pip install fastapi httpx pytest PyYAML
          python -m pytest -q tests/
      - name: Check Desktop entry as ESM
        run: |
          cp desktop/plugin.js /tmp/hsm-plugin.mjs
          node --check /tmp/hsm-plugin.mjs
          node tests/smoke-desktop.mjs